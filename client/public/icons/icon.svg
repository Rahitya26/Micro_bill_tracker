<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512" width="100%" height="100%">
  <!-- Solid Dark Obsidian Background - Minimalist Dual-Tone (White & Emerald) -->
  <rect width="512" height="512" fill="#090d16" />

  <!-- Top Bar 1 (Pure White) -->
  <line x1="140" y1="145" x2="360" y2="145" stroke="#ffffff" stroke-width="36" stroke-linecap="round" />

  <!-- Top Bar 2 (Pure White) -->
  <line x1="140" y1="215" x2="315" y2="215" stroke="#ffffff" stroke-width="36" stroke-linecap="round" />

  <!-- Vertical Stem (Emerald) -->
  <line x1="205" y1="145" x2="205" y2="385" stroke="#10b981" stroke-width="36" stroke-linecap="round" />

  <!-- Curved Upper Bowl (Emerald) -->
  <path d="M 205 145 C 295 145, 295 285, 205 285" fill="none" stroke="#10b981" stroke-width="36" stroke-linecap="round" stroke-linejoin="round" />

  <!-- Diagonal Forward Flow Stroke (Pure White) -->
  <line x1="205" y1="285" x2="355" y2="385" stroke="#ffffff" stroke-width="36" stroke-linecap="round" />

  <!-- Flow Arrow Head (Pure White) -->
  <polyline points="355,335 355,385 305,385" fill="none" stroke="#ffffff" stroke-width="26" stroke-linecap="round" stroke-linejoin="round" />
</svg>
