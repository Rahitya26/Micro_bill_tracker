<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512" width="100%" height="100%">
  <defs>
    <!-- Background Gradient -->
    <linearGradient id="bgGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#0f172a"/>
      <stop offset="50%" stop-color="#090d16"/>
      <stop offset="100%" stop-color="#040711"/>
    </linearGradient>

    <!-- Emerald-Cyan Energy Gradient -->
    <linearGradient id="flowGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#10b981"/>
      <stop offset="50%" stop-color="#06b6d4"/>
      <stop offset="100%" stop-color="#38bdf8"/>
    </linearGradient>

    <!-- Border Glow Gradient -->
    <linearGradient id="borderGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#10b981" stop-opacity="0.8"/>
      <stop offset="50%" stop-color="#06b6d4" stop-opacity="0.4"/>
      <stop offset="100%" stop-color="#3b82f6" stop-opacity="0.8"/>
    </linearGradient>

    <!-- Ambient Glow Filter -->
    <filter id="glow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="16" result="blur" />
      <feComposite in="SourceGraphic" in2="blur" operator="over" />
    </filter>
  </defs>

  <!-- App Icon Background Squircle -->
  <rect x="24" y="24" width="464" height="464" rx="112" fill="url(#bgGrad)" stroke="url(#borderGrad)" stroke-width="6" />

  <!-- Inner Subtle Grid Glow Circle -->
  <circle cx="256" cy="256" r="170" fill="none" stroke="url(#flowGrad)" stroke-width="1.5" stroke-dasharray="6,8" opacity="0.25"/>

  <!-- Glowing Emblem: Futuristic Rupee ₹ fused with Flow Arrow -->
  <g filter="url(#glow)">
    <!-- Top Horizontal Bar 1 -->
    <rect x="148" y="146" width="216" height="32" rx="16" fill="url(#flowGrad)"/>

    <!-- Top Horizontal Bar 2 -->
    <rect x="148" y="210" width="176" height="28" rx="14" fill="url(#flowGrad)"/>

    <!-- Central Curved Stem & Diagonal Leg -->
    <path d="M 218 150 
             L 218 300 
             C 275 300, 316 280, 316 230 
             C 316 180, 275 160, 218 160
             M 218 290 
             L 326 386 
             L 282 386 
             L 194 308 
             L 194 386 
             L 164 386 
             L 164 150" 
          fill="url(#flowGrad)" 
          stroke="url(#flowGrad)" 
          stroke-width="10" 
          stroke-linejoin="round" 
          stroke-linecap="round" />

    <!-- Upward Momentum Flow Pulse / Arrow at Top Right -->
    <path d="M 334 162 L 382 114 M 382 114 L 338 114 M 382 114 L 382 158" 
          fill="none" 
          stroke="url(#flowGrad)" 
          stroke-width="20" 
          stroke-linecap="round" 
          stroke-linejoin="round" />

    <!-- Pulse Sparkle Point -->
    <circle cx="382" cy="114" r="8" fill="#ffffff" />
  </g>
</svg>
